# All-points strict 2D projection + smooth A* + virtual-wall mission configuration.
# 核心安全原则：轨迹只输出 x,y，因此点云不能按高度“放行”。
# 本版本把 /cloud_registered 中所有有限点全部压缩到 XY 平面作为障碍。
# 不做高度切片、不做 z 过滤、不做近处点云忽略、不做起点清空、不做少量点阈值放行。
# 如果点云障碍挡住路径，则规划失败；绝不生成从障碍物上方穿过的 YAML。
# 虚拟墙：x >= -3.0 且 y >= -3.0。

radar_midpoint_node:
  frame_id: "camera_init"
  cloud_topic: "/cloud_registered"
  pose_topic: "/mavros/local_position/pose"
  midpoints_topic: "/radar_curve_planner/mid_points"
  marker_topic: "/radar_curve_planner/midpoint_markers"

  target3_x: -1.85
  target3_y: -2.80
  target3_z: 1.0
  use_target_z: false
  flight_height: 1.0

  drone_diameter: 0.85
  safety_margin: 0.04
  obstacle_inflation_extra: 0.00

  # ========================
  # 全点云 2D 投影避障
  # ========================
  # true：轨迹只输出 XY，所以所有有限点云点全部投影成 XY 障碍。
  # 绝不通过 z 高度判断“可以从上方飞过”。
  project_pointcloud_to_2d: true
  project_all_finite_points_to_2d: true

  # 下面高度切片参数保留只是为了兼容旧代码；本模式下不使用。
  use_height_slice_projection: false
  projection_slice_center_z: 0.80
  projection_slice_half_width: 0.15
  projection_min_z: -1000.0
  projection_max_z: 1000.0

  # 兼容旧模式：只有 project_pointcloud_to_2d=false 时才会使用。
  use_2d_z_filter: false
  obstacle_min_z: -1000.0
  obstacle_max_z: 1000.0

  # 严格安全：不忽略近处点云。
  self_filter_radius: 0.00

  enable_virtual_wall: true
  virtual_wall_min_x: -3.0
  virtual_wall_min_y: -3.0
  virtual_wall_max_x: 1000000000.0
  virtual_wall_max_y: 1000000000.0
  virtual_wall_margin: 0.00

  grid_resolution: 0.10
  grid_padding: 3.20
  max_grid_cells: 300000
  max_search_time: 0.45
  allow_diagonal: true

  # 严格安全：不清空起点/终点周围栅格。若起点或终点被障碍占据，则直接失败。
  clear_start_radius: 0.00
  clear_goal_radius: 0.00

  # A* 后处理：所有剪枝/圆角/平滑都要经过占据栅格检查，不安全则回退或失败。
  enable_line_of_sight_prune: true
  enable_corner_rounding: true
  corner_rounding_radius: 0.30
  corner_rounding_samples: 8

  enable_path_smoothing: true
  smoothing_iterations: 35
  smoothing_alpha: 0.15
  smoothing_check_step: 0.04

  output_spacing: 0.10
  min_output_points: 6

  # 如果平滑后不安全，回退到 A* 视线剪枝后的安全折线。
  fallback_to_raw_if_smoothing_invalid: true

  publish_markers: true

  # 严格安全：没有点云时不发布直线路径，避免盲飞穿障碍。
  allow_plan_without_cloud: false
  publish_straight_when_no_cloud: false
  print_pose: true
  print_plan: true
  status_period: 1.0
  max_plan_rate: 5.0

curve_yaml_writer_node:
  frame_id: "camera_init"
  cloud_topic: "/cloud_registered"
  midpoints_topic: "/radar_curve_planner/mid_points"
  fitted_path_topic: "/radar_curve_planner/fitted_path"
  marker_topic: "/radar_curve_planner/curve_markers"
  path_valid_topic: "/radar_curve_planner/path_valid"

  output_yaml: "/home/abot/kk_ws/src/radar_curve_planner/tmp/radar_generated_traj.yaml"
  traj_name: "traj1_4"
  output_coordinate_mode: "absolute"

  flight_height: 1.0
  drone_diameter: 0.85
  safety_margin: 0.04

  # 必须和 radar_midpoint_node 一致：最终 YAML 校验也用全点云 2D 投影。
  project_pointcloud_to_2d: true
  project_all_finite_points_to_2d: true

  # 下面高度切片参数保留只是为了兼容旧代码；本模式下不使用。
  use_height_slice_projection: false
  projection_slice_center_z: 0.80
  projection_slice_half_width: 0.15
  projection_min_z: -1000.0
  projection_max_z: 1000.0

  # 兼容旧模式：只有 project_pointcloud_to_2d=false 时才会使用。
  use_2d_z_filter: false
  obstacle_min_z: -1000.0
  obstacle_max_z: 1000.0

  # 严格安全：不忽略近处点云，不跳过起点段。
  self_filter_radius: 0.00
  start_ignore_curve_distance: 0.00

  enable_virtual_wall: true
  virtual_wall_min_x: -3.0
  virtual_wall_min_y: -3.0
  virtual_wall_max_x: 1000000000.0
  virtual_wall_max_y: 1000000000.0
  virtual_wall_margin: 0.00

  # 严格安全：1 个投影点进入机体碰撞半径就判定无效。
  min_collision_points: 1

  # 输入已经是安全平滑轨迹，writer 只做 resample 和校验，不做 Catmull-Rom 外凸。
  curve_mode: "resample"
  resample_step: 0.08

  max_curvature: 999.0
  max_turn_angle_deg: 179.0
  min_segment_len: 0.02
  sample_step: 0.06

  write_even_if_invalid: false
  one_shot: false
  one_shot_require_valid: true
  print_collision_cloud_count: true
